name: oidc-claims
on:
  pull_request:
    types: [opened, synchronize]
permissions:
  id-token: write
  contents: read
jobs:
  show:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnose OIDC endpoint reachability
        run: |
          echo "id_token_url_set   = $([ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && echo yes || echo NO)"
          echo "id_token_tok_set   = $([ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ] && echo yes || echo NO)"
          HOST=$(echo "$ACTIONS_ID_TOKEN_REQUEST_URL" | sed -E 's#https?://([^/]+).*#\1#')
          echo "id_token_host      = $HOST"
          echo "--- curl verbose (errors only) ---"
          curl -sS -o /dev/null -w 'http=%{http_code} exit_is_next\n' \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=oidc-claim-probe" 2>&1 | tail -6
          echo "curl_exit          = ${PIPESTATUS[0]}"
          echo "--- control: can this runner reach the public API at all? ---"
          curl -sS -o /dev/null -w 'api.github.com http=%{http_code}\n' https://api.github.com 2>&1 | tail -2
          curl -sS -o /dev/null -w 'pypi.org      http=%{http_code}\n' https://pypi.org 2>&1 | tail -2
